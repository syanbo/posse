name: posse_mobile
description: "Posse mobile client"
publish_to: 'none'
version: 0.1.14+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  file_selector: ^1.1.0
  flterm: ^0.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  gal: ^2.3.3
  html: ^0.15.7
  intl: any
  posse_quic:
    path: packages/posse_quic
  image_picker: ^1.2.4
  markdown: ^7.3.1
  pasteboard: ^0.5.0
  pinenacl: ^0.6.0
  re_highlight: ^0.0.3
  scrollview_observer: ^1.27.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  web_socket_channel: ^3.0.3
  xml: ^7.0.1
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
    - assets/splash_slogan.png
  # Nerd Fonts 的纯图标字体（MIT，许可在同目录）：starship、lazygit 等提示符里私有区的图标（如分支 U+E0A0）
  # 系统字体都没有，不带它在终端里是缺字方框。用 Mono 版，图标按一格宽画，不挤歪后面的字
  fonts:
    - family: Symbols Nerd Font Mono
      fonts:
        - asset: assets/fonts/SymbolsNerdFontMono-Regular.ttf

# 带改动的 flterm 0.0.5（改动见 third_party/flterm/POSSE.md）
dependency_overrides:
  flterm:
    path: third_party/flterm
