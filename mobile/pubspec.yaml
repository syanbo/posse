name: hive_mobile
description: "Hive mobile client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  flterm: ^0.0.5
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  markdown: ^7.3.1
  pasteboard: ^0.5.0
  pinenacl: ^0.6.0
  scrollview_observer: ^1.27.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

# 带改动的 flterm 0.0.5（改动见 third_party/flterm/HIVE.md）
dependency_overrides:
  flterm:
    path: third_party/flterm
